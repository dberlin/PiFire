# Line length is relaxed: ~99% of existing lines fit within 120 columns.
line-length = 120

[lint]
# Initial Ruff adoption baseline, captured during P0 gates.
# Keep syntax/error detection from default Ruff, but ignore current legacy rule families
# so `uv run ruff check .` can be used as a passing merge gate for new refactors.
# Remove these ignores incrementally in focused cleanup PRs.
ignore = [
    "E401",  # multiple imports on one line
    "E402",  # module import not at top of file
    "E711",  # comparison to None should use is/is not
    "E712",  # comparison to True/False should use is/is not
    "E713",  # membership test should use not in
    "E721",  # type comparison should use isinstance
    "E722",  # bare except
    "E731",  # lambda assignment
    "F401",  # unused imports
    "F403",  # star imports
    "F405",  # names from star imports
    "F541",  # f-string without placeholders
    "F841",  # unused variables
]
# `line-length` above is only advisory to the formatter unless E501 is selected
# explicitly -- it is NOT in Ruff's default rule set. It is enabled here scoped
# to tests/ only: the production tree has a measured backlog of long lines (128
# lines / 54 files) that would need a repo-wide reformat of its own (same
# reasoning the ruff 0.16 ceiling above already applies). The `!tests/**`
# per-file-ignore key ignores E501 everywhere except tests/ -- a bare `"*.py"`
# key matches every file by basename regardless of directory and would have
# silently ignored E501 tests-side too.
extend-select = ["E501"]

[lint.per-file-ignores]
"!tests/**" = ["E501"]
