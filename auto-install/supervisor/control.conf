[program:control]
command=/usr/local/bin/pifire/auto-install/start-control.sh
directory=/usr/local/bin/pifire
autostart=true
autorestart=true
startretries=3
stopasgroup=true
stderr_logfile=/usr/local/bin/pifire/logs/control.err.log
stdout_logfile=/usr/local/bin/pifire/logs/control.out.log
; control and display run as different users but write the same log files.
; 002 keeps every log group-writable so whichever starts first does not lock
; the other out -- see pifire_prepare_log_dir, which owns the logs/ setgid bit.
umask=002
