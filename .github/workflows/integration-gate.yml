name: Exact revision integration gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: exact-revision-integration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  integration-gate:
    name: Exact revision integration gate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      TZ: America/New_York
      PYTEST_XDIST_AUTO_NUM_WORKERS: "1"
    steps:
      - name: Check out the exact event revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Jujutsu
        uses: taiki-e/install-action@v2
        with:
          tool: jj-cli

      - name: Materialize the exact revision for Jujutsu
        shell: bash
        run: |
          set -euo pipefail
          jj git init --colocate .
          jj --ignore-immutable edit "${GITHUB_SHA}"
          resolved="$(jj --no-pager log --no-graph -r @ -T 'commit_id ++ "\n"')"
          test "${resolved}" = "${GITHUB_SHA}"

      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes cabextract libegl1 libglib2.0-dev
          font_tmp="$(mktemp -d)"
          trap 'rm -rf "${font_tmp}"' EXIT
          curl --fail --location --retry 3 \
            "https://downloads.sourceforge.net/project/mscorefonts2/cabs/EUupdate.EXE" \
            --output "${font_tmp}/EUupdate.EXE"
          curl --fail --location --retry 3 \
            "https://downloads.sourceforge.net/project/corefonts/the%20fonts/final/impact32.exe" \
            --output "${font_tmp}/impact32.exe"
          printf '%s  %s\n' \
            "464dd2cd5f09f489f9ac86ea7790b7b8548fc4e46d9f889b68d2cdce47e09ea8" \
            "${font_tmp}/EUupdate.EXE" | sha256sum --check -
          printf '%s  %s\n' \
            "6061ef3b7401d9642f5dfdb5f2b376aa14663f6275e60a51207ad4facf2fccfb" \
            "${font_tmp}/impact32.exe" | sha256sum --check -
          mkdir "${font_tmp}/extracted"
          cabextract -q -d "${font_tmp}/extracted" "${font_tmp}/EUupdate.EXE"
          cabextract -q -F Impact.TTF -d "${font_tmp}/extracted" "${font_tmp}/impact32.exe"
          printf '%s  %s\n' \
            "b69a5b33e997c3bc55f35dde8267cb93fe5fbdc3ecbc23b1d987602a9fd2b1f2" \
            "${font_tmp}/extracted/trebuc.ttf" | sha256sum --check -
          printf '%s  %s\n' \
            "7fea7f91f1140721bd7837a36ed2b1c856215f3ac08e6d2eb29c1afe235d0900" \
            "${font_tmp}/extracted/trebucbd.ttf" | sha256sum --check -
          printf '%s  %s\n' \
            "00f1fc230ac99f9b97ba1a7c214eb5b909a78660cb3826fca7d64c3af5a14848" \
            "${font_tmp}/extracted/Impact.TTF" | sha256sum --check -
          sudo install -d -m 0755 "/usr/local/share/fonts/pifire-reference"
          sudo install -m 0644 \
            "${font_tmp}/extracted/"*.ttf \
            "/usr/local/share/fonts/pifire-reference/"
          sudo install -m 0644 \
            "${font_tmp}/extracted/Impact.TTF" \
            "/usr/local/share/fonts/pifire-reference/impact.ttf"
          sudo fc-cache -f

      - name: Install locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          uv sync --locked --all-groups
          bun install --frozen-lockfile
          (
            cd web-react
            bun run build
          )
          bunx playwright install --with-deps chromium

      - name: Run the exact revision gate against an isolated live PiFire
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/exact_revision_gate.py verify-ci --expected-revision "${{ github.sha }}"

      - name: Upload exact-revision evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exact-revision-${{ github.sha }}
          path: .artifacts/exact-revision/${{ github.sha }}/
          include-hidden-files: true
          if-no-files-found: error
