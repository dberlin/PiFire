[project]
name = "pifire"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apprise>=1.11.0",
    "bleak>=3.0.2",
    "bluepy>=1.3.0",
    "flask>=3.1.3",
    "flask-mobility>=2.0.1",
    "flask-qrcode>=3.2.0",
    "flask-socketio>=5.6.1",
    "gunicorn>=26.0.0",
    "hidapi>=0.14.0",
    # [ciso] pulls ciso8601 for fast timestamp parsing. The extra used to be
    # applied by each installer's own `uv pip install influxdb_client[ciso]`
    # line; it lives here now so there is one place that decides it.
    "influxdb-client[ciso]>=1.50.0",
    "netifaces>=0.11.0",
    "paho-mqtt>=2.1.0",
    "pyftdi>=0.55.0",
    "pyserial>=3.5",
    "pillow>=12.2.0",
    "psutil>=7.2.2",
    "pydantic>=2.13",
    "pydantic-partial>=0.11",
    "ratelimitingfilter>=1.5",
    # Imported unconditionally by grillplat/raspberry_pi_all.py. It was only
    # ever in auto-install/requirements.txt, so the dev venv never had it --
    # the platform tests stub the module, which is why nothing noticed.
    "rpi-hardware-pwm>=0.2.2",
    "scikit-fuzzy>=0.5.0",
    "scikit-learn>=1.9.0",
    "thermoworks-cloud>=0.1.13",
    "uuid>=1.30",
    "zeroconf>=0.149.17",
    "adafruit-extended-bus>=1.0.2",
    "adafruit-circuitpython-emc2101>=1.0.0",
    "adafruit-circuitpython-busdevice>=5.0.0",
    "adafruit-circuitpython-mcp9600>=2.0.10",
    "adafruit-circuitpython-vl53l0x>=3.6.19",
    "adafruit-circuitpython-vl53l4cd>=1.3.6",
    "adafruit-circuitpython-vl53l1x>=1.0.0",
    "gpiozero>=2.0.1",
    "pygame-ce>=2.5.7",
    "pyside6>=6.11.1",
    "easymcp2221>=1.8.4",
]

[project.optional-dependencies]
# do-mpc drags in CasADi, which publishes no Linux-ARM wheel and so builds from
# source -- minutes of compilation and a C++ toolchain on every Pi. Only the MPC
# controller needs it, and only on its default 'nlp' policy (the 'net' policy is
# pure numpy/scipy). Every import of it is lazy (controller/mpc.py:191,
# controller/mpc_model.py:112,342), so an install without this extra runs fine
# until someone selects MPC. Installed on demand when that happens.
#
# Deliberately NOT do-mpc[full]. That extra is asyncua + ipykernel + onnx +
# packaging + torch, and torch alone is gigabytes onto an SD card. Nothing PiFire
# runs on a grill imports any of them: the 'net' policy is hand-rolled numpy
# (controller/mpc_net.py) and the 'nlp' policy uses do_mpc.controller.MPC, which
# needs only the core casadi/numpy/scipy/pandas/matplotlib requirements. `full`
# is what TRAINS the net, so it lives in the dev group below instead.
mpc = ["do-mpc>=5.1.1"]

[dependency-groups]
dev = [
    # do-mpc WITH [full], unlike the runtime `mpc` extra above: torch and
    # do_mpc.approximateMPC are what generate the 'net' policy's weights
    # (docs/superpowers/experiments/approxmpc_span.py, export_span_net.py,
    # driven by tools/regenerate_mpc_net.py). A dev machine also gets the core
    # package, so tests/unit/mpc/ can exercise do-mpc for real; `uv sync
    # --no-dev`, which is what the installers run, leaves the whole thing out
    # and skips the CasADi source build.
    "do-mpc[full]>=5.1.1",
    "diff-cover>=9.0.0",
    "ipython>=9.14.1",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-playwright>=0.7.1",
    "ruff>=0.8.0",
]

[tool.coverage.run]
branch = true
concurrency = ["thread"]          # web/ui tests run the app in a background thread; without this the route code reads as 0%
source = ["blueprints", "common", "controller", "display", "file_mgmt", "grillplat", "notify", "probes"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/venv/*",
    # BLE-only probes: require bluepy + real Bluetooth hardware to exercise
    # meaningfully; deferred from the coverage floor by decision 2026-07-21.
    "probes/bt_meater.py",
    "probes/bt_meater_exp.py",
    "probes/bt_ibbq.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "def __repr__",
]
