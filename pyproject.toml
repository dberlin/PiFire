[project]
name = "pifire"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "apprise>=1.11.0",
    "bleak>=3.0.2",
    "bluepy>=1.3.0",
    "flask>=3.1.3",
    "flask-mobility>=2.0.1",
    "flask-qrcode>=3.2.0",
    "flask-socketio>=5.6.1",
    "gunicorn>=26.0.0",
    "hidapi>=0.14.0",
    # [ciso] pulls ciso8601 for fast timestamp parsing. The extra used to be
    # applied by each installer's own `uv pip install influxdb_client[ciso]`
    # line; it lives here now so there is one place that decides it.
    "influxdb-client[ciso]>=1.50.0",
    "netifaces>=0.11.0",
    # Imported eagerly by controller/fopdt_identifier.py, which controller/pid_sp.py
    # loads at module scope -- the shipped PID Smith Predictor controller depends on
    # it unconditionally, so it cannot live in an optional extra. scipy also
    # pulls numpy, but this declaration stops a future dependency change from
    # silently taking numpy with it.
    "numpy>=1.26",
    "paho-mqtt>=2.1.0",
    "pyftdi>=0.55.0",
    "pyserial>=3.5",
    "pillow>=12.2.0",
    "psutil>=7.2.2",
    "pydantic>=2.13",
    "pydantic-partial>=0.11",
    "ratelimitingfilter>=1.5",
    # Imported unconditionally by grillplat/raspberry_pi_all.py. It was only
    # ever in auto-install/requirements.txt, so the dev venv never had it --
    # the platform tests stub the module, which is why nothing noticed.
    "rpi-hardware-pwm>=0.2.2",
    # Runtime imports in controller/{grey_box,mpc_model,update_mpc}.py require
    # SciPy in every production venv, not only development/codegen environments.
    "scipy>=1.18.0",
    "thermoworks-cloud>=0.1.13",
    "uuid>=1.30",
    "zeroconf>=0.149.17",
    "adafruit-extended-bus>=1.0.2",
    "adafruit-circuitpython-emc2101>=1.0.0",
    "adafruit-circuitpython-busdevice>=5.0.0",
    "adafruit-circuitpython-mcp9600>=2.0.10",
    "adafruit-circuitpython-vl53l0x>=3.6.19",
    "adafruit-circuitpython-vl53l4cd>=1.3.6",
    "adafruit-circuitpython-vl53l1x>=1.0.0",
    "gpiozero>=2.0.1",
    "pygame-ce>=2.5.7",
    "pyside6>=6.11.1",
    "easymcp2221>=1.8.4",
]


[dependency-groups]
codegen = [
    "casadi==3.7.2",
    "cython==3.2.9",
    "deprecated==1.3.1",
    "matplotlib==3.11.1",
    "numpy==2.5.1",
    "scipy==1.18.0",
    "setuptools-scm==8.3.1",
]
dev = [
    "diff-cover>=9.0.0",
    "ipython>=9.14.1",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-playwright>=0.7.1",
    "pytest-random-order>=1.2.0",
    # The controller/MPC test surface also needs casadi and pandas. SciPy is a
    # production dependency above; its exact group pin stays aligned with the
    # codegen environment while these groups resolve together. casadi is used by
    # tests/unit/acados/test_grey_box_definition.py; pandas by
    # tests/unit/mpc/test_mpc_{calibration,refit}.py.
    "casadi==3.7.2",
    "scipy==1.18.0",
    "pandas>=3.0",
    # A hung test under `-n auto` stalls the whole run with no failing test to
    # point at. Several probe/display loops retry forever when their exit
    # condition is broken, so a wall-clock ceiling is the only thing that turns
    # "CI is stuck" into a named failure.
    "pytest-timeout>=2.3.0",
    # Restarts control.py on a source change. gunicorn has --reload for the web
    # tier; control.py is a plain long-running process with no equivalent, and a
    # worker serving code the checkout no longer has is a recurring source of
    # confusion. Dev only -- do not run this against a live cook.
    "watchfiles>=0.24.0",
    "ruff>=0.16",
    "pytest-xdist>=3.8.0",
]

[tool.pytest.ini_options]
# `pytest tests/` is the documented run and is expected to take minutes, not
# tens of minutes. The `slow` tests simulate whole multi-hour cooks; they are
# excluded here so the default run selects them out rather than silently
# absorbing a quarter-hour. Run them with `pytest -m slow` (a later `-m` wins
# over this one), and never alongside the suite's wall-clock budget
# assertions -- a loaded machine fails those on timing alone.
addopts = ["--random-order", "-n", "auto", "-m", "not slow", "--timeout=120", "--timeout-method=thread"]
markers = [
    "slow: simulates whole cooks and runs for minutes; excluded from the default run by addopts above.",
]


[tool.coverage.run]
branch = true
concurrency = ["thread"]          # web/ui tests run the app in a background thread; without this the route code reads as 0%
source = ["blueprints", "common", "controller", "display", "file_mgmt", "grillplat", "notify", "probes"]
omit = [
    "tests/*",
    "*/__pycache__/*",
    "*/.venv/*",
    "*/venv/*",
    # BLE-only probes: require bluepy + real Bluetooth hardware to exercise
    # meaningfully; deferred from the coverage floor by decision 2026-07-21.
    "probes/bt_meater.py",
    "probes/bt_meater_exp.py",
    "probes/bt_ibbq.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "def __repr__",
]
